[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backage"
dynamic = ["version"]
description = "Generate self-hosted GitHub Packages metadata indexes."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ipitio", email = "ipitio@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.26,<1",
]

[dependency-groups]
dev = [
    "pylint==4.0.6",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[project.urls]
Repository = "https://github.com/ipitio/backage"

[project.scripts]
bkg = "bkg_py.cli:entrypoint"

[tool.setuptools.dynamic]
version = { attr = "bkg_py.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bkg_py*"]

[tool.uv]
required-version = "==0.12.*"

[tool.pylint.main]
fail-on = ["F", "E", "W", "R", "C"]
persistent = false
py-version = "3.14"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.similarities]
min-similarity-lines = 12

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
    "SIM",
    "C4",
    "PIE",
    "RSE",
    "RET",
    "PERF",
    "FURB",
    "ARG",
    "BLE",
    "PTH",
    "DTZ",
    "ASYNC",
    "LOG",
    "C90",
    "PL",
    "PGH",
    "T10",
    "PT",
    "S",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"src/bkg_py/commands.py" = ["PLC0415", "T201"]
"src/bkg_py/database/batch_progress.py" = ["S608"]
"src/bkg_py/database/catalog.py" = ["S608"]
"src/bkg_py/database/history_layout.py" = ["S608"]
"src/bkg_py/database/history_packages.py" = ["S608"]
"src/bkg_py/database/metrics.py" = ["S608"]
"src/bkg_py/database/owner_plans.py" = ["S608"]
"src/bkg_py/database/owner_scans.py" = ["S608"]
"src/bkg_py/database/package_plans.py" = ["S608"]
"src/bkg_py/database/package_history.py" = ["S608"]
"src/bkg_py/database/version_history.py" = ["S608"]
"src/bkg_py/validation.py" = ["S314", "T201"]
"src/test/**/test_*.py" = ["PLR2004", "S101"]
"src/test/database/test_repository.py" = ["S608"]
"src/test/database/repository_support.py" = ["S608"]
"src/test/test_discovery.py" = ["S105"]
"src/test/test_github.py" = ["S105"]
"src/test/test_registry.py" = ["S105"]
"src/test/test_rendering.py" = ["S608"]
"src/test/test_state.py" = ["S603", "S607"]

[tool.pyright]
include = ["src/bkg_py", "src/test"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
venvPath = "/opt"
venv = "bkg-test"
typeCheckingMode = "strict"
reportDeprecated = "error"
