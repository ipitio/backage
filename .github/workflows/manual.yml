name: manual

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["build"]
    types: [completed]

  pull_request:
    types:
      - closed

defaults:
  run:
    # GitHub Actions run without a TTY device. This is a workaround to get one,
    # based on https://github.com/actions/runner/issues/241#issuecomment-2019042651
    shell: 'script --return --quiet --log-out /dev/null --command "bash -e {0}"'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}
  GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
  BKG_HANDOFF_CONTROL_REF: refs/heads/bkg-control
  BKG_HANDOFF_POLL_SECONDS: 60

jobs:
  handoff:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Request graceful handoff
        run: PYTHONPATH=src python -m bkg_py handoff request

  update:
    needs: handoff
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}

    concurrency:
      group: ${{ github.repository }}-database-publication
      cancel-in-progress: false
      queue: max

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for release
        id: release
        continue-on-error: true
        uses: cardinalby/git-get-release-action@v1
        with:
          latest: true

      - name: Fetch all data
        if: ${{ steps.release.outcome == 'success' }}
        continue-on-error: true
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: "*.db"
          tarBall: false
          zipBall: false
          out-file-path: ".bkg/.snapshot"

      - name: Update
        id: update
        run: |
          set +e
          run_date=$(date -u +%F)
          docker run -v $PWD:/app -v /var/run/docker.sock:/var/run/docker.sock \
            -e BKG_DOCKER_SIZE_FALLBACK=true \
            --env-file <(env | grep -E '^(GITHUB|BKG_HANDOFF_)') \
            ghcr.io/$GITHUB_OWNER/$GITHUB_REPO:master \
            bkg workflow-update -C /app -D "$run_date"
          code=$?
          echo "updated=$code" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Get date
        id: date
        env:
          RUN_DATE: ${{ steps.update.outputs.run_date }}
        run: |
          release_tag=$(docker run --rm ghcr.io/$GITHUB_OWNER/$GITHUB_REPO:master bkg release-tag -D "$RUN_DATE")
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Save database
        if: ${{ steps.update.outputs.updated == '0' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bkg/.snapshot/*"
          bodyFile: "bkg/CHANGELOG.md"
          tag: "${{ steps.date.outputs.tag }}"
          commit: "master"
          allowUpdates: true
