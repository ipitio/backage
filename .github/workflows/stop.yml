name: stop

on:
  workflow_dispatch:

env:
  BKG_HANDOFF_CONTROL_REF: refs/heads/bkg-control

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Request graceful stop
        run: PYTHONPATH=src python -m bkg_py handoff request
